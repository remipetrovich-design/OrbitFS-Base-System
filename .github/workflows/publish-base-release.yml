name: Build OrbitFS Base Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Base release version (for example 1.0.0, v1.0.0.0, v.1.0.0, B0.0.0, D.0.0.0)
        required: true
        type: string
      source_sha:
        description: Exact base-release commit to package
        required: true
        type: string
      channel:
        description: Base release channel
        required: true
        default: stable
        type: string
      notes:
        description: Optional operator release notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: orbitfs-base-release-${{ inputs.version }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  candidate:
    outputs:
      release_id: ${{ steps.master-release.outputs.id }}
      license_master_url: ${{ steps.license-master.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: fallback
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://incendiarynetworks.cc/api/v1/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. Remaining workflow steps are disabled."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Require base-release source
        if: steps.profile.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "base-release" ]; then
            echo "::error::Base release candidates may only be built from base-release."
            exit 1
          fi

      - name: Checkout exact Base source
        if: steps.profile.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify Base source identity
        if: steps.profile.outputs.run == 'true'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "::error::Checked-out source does not match requested Base commit."; exit 1; }
          git fetch origin base-release --prune
          test "$(git rev-parse origin/base-release)" = "$SOURCE_SHA" || { echo "::error::base-release moved after selection. Inspect the new tip and run the release again."; exit 1; }

      - name: Set up Node
        if: steps.profile.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.profile.outputs.run == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.profile.outputs.run == 'true'
        run: npm run check

      - name: Production build
        if: steps.profile.outputs.run == 'true'
        run: npm run build

      - name: Resolve Master Database Base package
        if: steps.profile.outputs.run == 'true'
        id: database-package
        shell: bash
        env:
          RAW_LICENSE_MASTER_URL: ${{ vars.LICENSE_MASTER_URL || 'https://incendiarynetworks.cc/api/v1' }}
          LICENSE_MASTER_API_TOKEN: ${{ secrets.LICENSE_MASTER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$LICENSE_MASTER_API_TOKEN" || { echo "::error::Missing LICENSE_MASTER_API_TOKEN repository secret."; exit 1; }

          LICENSE_MASTER_URL="$(RAW_LICENSE_MASTER_URL="$RAW_LICENSE_MASTER_URL" node - <<'NODE'
          const raw=String(process.env.RAW_LICENSE_MASTER_URL||'').trim();
          const u=new URL(raw);
          if(u.protocol!=='https:'||u.search||u.hash)throw new Error('LICENSE_MASTER_URL must be HTTPS');
          let path=u.pathname.replace(/\/+$/,'');
          if(path==='/api')path='/api/v1';
          if(path!=='/api/v1')throw new Error('LICENSE_MASTER_URL path must be /api or /api/v1');
          u.pathname=path;
          process.stdout.write(u.toString().replace(/\/$/,''));
          NODE
          )"

          list="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $LICENSE_MASTER_API_TOKEN"             "$LICENSE_MASTER_URL/database-packages?component=base")"
          package_id="$(jq -r '[.packages[]? | select(.source_repo=="lucaskerim123/Master-Database-System" and (.status=="candidate" or .status=="current"))] | sort_by(.database_schema_version,.created_at) | last | .id // empty' <<<"$list")"

          if [ -n "$package_id" ]; then
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $LICENSE_MASTER_API_TOKEN" \
              "${LICENSE_MASTER_URL%/}/database-packages/$package_id")"
            echo "Using Master Database Base package: $package_id"
          else
            echo "::warning::No Master Database Base package is registered yet; using License Manager's last current immutable Base package fallback."
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $LICENSE_MASTER_API_TOKEN" \
              "${LICENSE_MASTER_URL%/}/database-packages/base/current")"
            package_id="$(jq -r '.package.id // empty' <<<"$response")"
            test -n "$package_id" || { echo "::error::No current Base database package fallback is available."; exit 1; }
          fi


          PACKAGE_RESPONSE="$response" node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const body=JSON.parse(process.env.PACKAGE_RESPONSE||'{}'),row=body.package,p=row?.payload;
          if(!body.ok||!p||p.format!=='orbitfs-customer-database-package-v1'||p.component!=='base')throw new Error('Invalid central Base database package');
          if(p.sourceRepo!=='lucaskerim123/Master-Database-System'||!/^[a-f0-9]{40}$/.test(String(p.sourceCommit||'')))throw new Error('Central Base package identity is invalid');

          const snapshot=p.snapshot;
          if(!snapshot||snapshot.encoding!=='base64'||typeof snapshot.data!=='string')throw new Error('Central Base package is missing its fresh-install snapshot');
          const snapshotBytes=Buffer.from(snapshot.data,'base64');
          const snapshotSha=crypto.createHash('sha256').update(snapshotBytes).digest('hex');
          if(snapshotBytes.length!==Number(snapshot.size)||snapshotSha!==String(snapshot.sha256||'').toLowerCase())throw new Error('Central Base snapshot integrity failed');

          fs.mkdirSync('supabase/migrations',{recursive:true});
          for(const name of fs.readdirSync('supabase/migrations')){
            if(name.toLowerCase().endsWith('.sql'))fs.rmSync(path.join('supabase/migrations',name),{force:true});
          }
          fs.writeFileSync('supabase/customer-schema.sql',snapshotBytes);

          const migrations=Array.isArray(p.migrations)?p.migrations:[];
          if(Number(p.migrationCount)!==migrations.length||!migrations.length)throw new Error('Central Base migration history is invalid');
          const rows=[];
          for(const m of migrations){
            const file=String(m?.file||'').replaceAll('\\','/');
            const match=file.match(/^supabase\/migrations\/(\d{14})_[A-Za-z0-9._-]+\.sql$/);
            if(!match||m.component!=='base'||m.encoding!=='base64')throw new Error('Invalid central Base migration path: '+file);
            const bytes=Buffer.from(m.data,'base64');
            const sha=crypto.createHash('sha256').update(bytes).digest('hex');
            if(bytes.length!==Number(m.size)||sha!==String(m.sha256||'').toLowerCase())throw new Error('Central Base migration integrity failed: '+file);
            fs.writeFileSync(file,bytes);
            rows.push({id:match[1],file,size:bytes.length,sha256:sha});
          }
          rows.sort((a,b)=>a.id.localeCompare(b.id));
          const root=rows[0],latest=rows.at(-1);
          const metadata={
            format:'orbitfs-database-schema-v1',
            schemaVersion:String(p.databaseSchemaVersion),
            path:'supabase/customer-schema.sql',
            sha256:snapshotSha,
            migrationCount:rows.length,
            latestMigration:latest.id,
            rootMigration:root.id,
            rootSha256:root.sha256,
            migrations:rows,
            sourceRepo:p.sourceRepo,
            sourceCommit:p.sourceCommit,
            componentBoundary:{
              format:'orbitfs-database-component-boundary-v1',
              owner:'base',
              freshInstallOnly:true,
              excludedComponents:['engine-shared','mcp','apex','studio']
            }
          };
          fs.writeFileSync('orbitfs-database-schema.json',JSON.stringify(metadata,null,2));
          NODE

          reference="$(jq -c '{id:.package.id,component:.package.component,databaseSchemaVersion:.package.databaseSchemaVersion,sha256:.package.sha256,sourceRepo:.package.sourceRepo,sourceCommit:.package.sourceCommit}' <<<"$response")"
          jq -e '.id|type=="string" and length>0' <<<"$reference" >/dev/null
          jq -e '.sha256|test("^[a-f0-9]{64}$")' <<<"$reference" >/dev/null
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Resolved central Base database package: $package_id"

      - name: Build Base deployment artifact
        if: steps.profile.outputs.run == 'true'
        id: package
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="orbitfs-base-v${VERSION}.json.gz"
          node tools/build-panel-release.mjs \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --commit "$SOURCE_SHA" \
            --database-metadata orbitfs-database-schema.json \
            --output "$ARTIFACT"
          test -s "$ARTIFACT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Validate Base deployment artifact
        if: steps.profile.outputs.run == 'true'
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),{gunzipSync}=require('node:zlib');
          const artifact=process.env.ARTIFACT;
          const pkg=JSON.parse(gunzipSync(fs.readFileSync(artifact)).toString('utf8'));
          if(pkg.format!=='orbitfs-base-deployment-v2'||Number(pkg.schemaVersion)!==2)throw new Error('Invalid Base deployment package format');
          if(pkg.version!==process.env.VERSION||pkg.sourceCommit!==process.env.SOURCE_SHA)throw new Error('Base package source/version mismatch');
          if(!Array.isArray(pkg.components)||pkg.components.length!==1||pkg.components[0]!=='base')throw new Error('Base package components must be exactly [base]');
          if(pkg.checkpointRequired!==false)throw new Error('Base package must not declare an update checkpoint requirement');
          const lifecycle=pkg.releaseLifecycle;
          if(!lifecycle||lifecycle.mode!=='single-current-per-channel'||lifecycle.onPublish!=='supersede-previous-published-base'||lifecycle.archiveSuperseded!==true||lifecycle.hideSupersededByDefault!==true||lifecycle.preserveRollbackHistory!==true)throw new Error('Base release lifecycle contract is invalid');
          if(!pkg.projectSettings||pkg.projectSettings.framework!=='sveltekit'||pkg.projectSettings.buildCommand!=='npm run build'||pkg.projectSettings.installCommand!=='npm ci')throw new Error('Base Vercel project settings are invalid');
          if(!Array.isArray(pkg.files)||!pkg.files.length||Number(pkg.fileCount)!==pkg.files.length)throw new Error('Base file list is invalid');
          const seen=new Set();
          for(const f of pkg.files){
            if(!f?.file||seen.has(f.file)||f.encoding!=='base64'||typeof f.data!=='string')throw new Error('Invalid or duplicate Base file');
            seen.add(f.file);
            const data=Buffer.from(f.data,'base64');
            const sha=crypto.createHash('sha256').update(data).digest('hex');
            if(data.length!==Number(f.size)||sha!==String(f.sha256||'').toLowerCase())throw new Error('Base file integrity failure: '+f.file);
          }
          for(const required of [
            'package.json','package-lock.json','svelte.config.js','vite.config.ts',
            'tools/prepare-license-runtime.mjs','deployment/base-environment.json','supabase/customer-schema.sql',
            'src/lib/server/vercel-engine-provision.ts','src/lib/server/engine-host.ts',
            'src/lib/server/engine-release-client.ts','src/lib/server/engine-update-planner.ts',
            'src/lib/server/license.ts','src/lib/server/runtime-secrets.ts',
            'src/routes/api/engine-host/+server.ts','src/routes/api/engine-host/[action]/+server.ts',
            'src/routes/api/engine-host/launch/+server.ts','src/routes/api/engine-license/+server.ts',
            'src/routes/api/license/activate/+server.ts','src/routes/api/license/status/+server.ts',
            'src/hooks.server.ts','src/routes/setup/+page.svelte','src/routes/setup/owner/+page.svelte',
            'src/routes/api/setup/[...rest]/+server.ts','src/routes/api/setup/status/+server.ts',
            'src/routes/api/setup/owner/+server.ts','src/routes/api/store/update-engine/+server.ts'
          ]){
            if(!seen.has(required))throw new Error('Missing required Base runtime/deployer file: '+required);
          }
          if(!String(pkg.databaseSchemaVersion||'')||pkg.databaseSchemaPath!=='supabase/customer-schema.sql'||!/^[a-f0-9]{64}$/i.test(String(pkg.databaseSchemaSha256||'')))throw new Error('Base database snapshot metadata is invalid');
          if(!Number.isInteger(Number(pkg.databaseMigrationCount))||Number(pkg.databaseMigrationCount)<1||!/^\d{14}$/.test(String(pkg.databaseLatestMigration||'')))throw new Error('Base migration metadata is invalid');
          if(!Array.isArray(pkg.databaseMigrations)||pkg.databaseMigrations.length!==Number(pkg.databaseMigrationCount))throw new Error('Base database migration inventory is incomplete');
          if(!/^\d{14}$/.test(String(pkg.databaseMigrationRoot||''))||!/^[a-f0-9]{64}$/i.test(String(pkg.databaseMigrationRootSha256||'')))throw new Error('Base database migration root is invalid');
          const boundary=pkg.databaseComponentBoundary;
          if(boundary?.format!=='orbitfs-database-component-boundary-v1'||boundary?.freshInstallOnly!==true||boundary?.owner!=='base')throw new Error('Base database component boundary is invalid');
          if(!Array.isArray(boundary.excludedComponents)||!['engine-shared','mcp','apex','studio'].every(x=>boundary.excludedComponents.includes(x)))throw new Error('Base database component exclusions are incomplete');
          const chain=pkg.databaseMigrationChain;
          if(chain?.format!=='orbitfs-base-migration-chain-v1'||chain?.complete!==true||chain?.baseline!==true||Number(chain?.migrationCount)!==Number(pkg.databaseMigrationCount))throw new Error('Base database migration chain contract is incomplete');
          if(String(chain.rootMigration)!==String(pkg.databaseMigrationRoot)||String(chain.rootSha256).toLowerCase()!==String(pkg.databaseMigrationRootSha256).toLowerCase()||String(chain.latestMigration)!==String(pkg.databaseLatestMigration))throw new Error('Base database migration chain metadata is inconsistent');
          if(!Array.isArray(chain.migrations)||chain.migrations.length!==Number(pkg.databaseMigrationCount))throw new Error('Base database migration chain inventory is incomplete');
          const first=pkg.databaseMigrations[0],last=pkg.databaseMigrations[pkg.databaseMigrations.length-1];
          if(String(first?.id)!==String(pkg.databaseMigrationRoot)||String(first?.sha256).toLowerCase()!==String(pkg.databaseMigrationRootSha256).toLowerCase()||String(last?.id)!==String(pkg.databaseLatestMigration))throw new Error('Base database migration chain endpoints do not match the inventory');
          const schema=pkg.files.find(f=>f.file===pkg.databaseSchemaPath);
          if(schema.sha256!==String(pkg.databaseSchemaSha256).toLowerCase())throw new Error('Base schema checksum does not match packaged snapshot');
          const schemaSql=Buffer.from(schema.data,'base64').toString('utf8');
          for(const marker of [
            'orbitfs_repair_runtime_access',
            'orbitfs_runtime_secret_probe',
            'private.orbitfs_server_secret_valid',
            'orbitfs runtime secret access',
            'orbitfs runtime secret required'
          ]){
            if(!schemaSql.includes(marker))throw new Error('Base customer schema is missing runtime database contract marker: '+marker);
          }
          const inner=pkg.files.find(f=>f.file==='src/lib/server/vercel-engine-provision.ts');
          const innerSource=inner?Buffer.from(inner.data,'base64').toString('utf8'):'';
          for(const marker of [
            'ORBITFS_DATABASE_RUNTIME_ACCESS_CONTRACT',
            'ENGINE_DATABASE_RUNTIME_ACCESS_REPAIR_UNAVAILABLE',
            'runtimeSecretProbeTable',
            'repairEngineDatabaseRuntimeAccess',
            'ORBITFS_SUPABASE_CONNECTION_ATTESTATION',
            'ENGINE_SUPABASE_PROJECT_MISMATCH',
            'ENGINE_SUPABASE_PUBLISHABLE_KEY_MISMATCH',
            'ENGINE_SUPABASE_SERVER_KEY_MISMATCH',
            'ENGINE_DATABASE_PUBLISHABLE_KEY_REJECTED',
            'ENGINE_DATABASE_SERVER_KEY_REJECTED'
          ]){
            if(!innerSource.includes(marker))throw new Error('Inner Engine deployer is missing runtime database contract marker: '+marker);
          }
          if(innerSource.includes('legacy-service-key-fallback'))throw new Error('Inner Engine deployer still contains the legacy service-key fallback');
          const envFile=pkg.files.find(f=>f.file==='deployment/base-environment.json');
          const envContract=envFile?JSON.parse(Buffer.from(envFile.data,'base64').toString('utf8')):null;
          const envNames=new Set((Array.isArray(envContract?.variables)?envContract.variables:[]).map(item=>String(item?.name||'')));
          for(const name of ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_SECRET_KEY','ORBITFS_SUPABASE_CONNECTION_ATTESTATION','ORBITFS_DB_SECRET']){
            if(!envNames.has(name))throw new Error('Base deployment environment contract is missing '+name);
          }
          console.log('Base deployment artifact validated:',pkg.version,'files='+pkg.fileCount,'migrations='+pkg.databaseMigrationCount);
          NODE

      - name: Generate Base changelog
        if: steps.profile.outputs.run == 'true'
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPERATOR_NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# OrbitFS Base — v$VERSION"
            echo
            echo "**Release type:** Base"
            echo
            echo "**Source:** $GITHUB_REPOSITORY@base-release"
            echo
            echo "**Commit:** $SOURCE_SHA"
            echo
            echo "## Source"
            git log -1 --format='- %s (%H)' "$SOURCE_SHA"
            if [ -n "$OPERATOR_NOTES" ]; then
              echo
              echo "## Operator notes"
              printf '%s\n' "$OPERATOR_NOTES"
            fi
            echo
            echo "This candidate requires License Manager technical validation, manual approval and publication before any customer Base deployment may use it."
          } > release-notes.md

      - name: Normalize License Manager URL
        if: steps.profile.outputs.run == 'true'
        id: license-master
        env:
          RAW_LICENSE_MASTER_URL: ${{ vars.LICENSE_MASTER_URL || 'https://incendiarynetworks.cc/api/v1' }}
        shell: bash
        run: |
          set -euo pipefail
          normalized="$(RAW_LICENSE_MASTER_URL="$RAW_LICENSE_MASTER_URL" node - <<'NODE'
          const raw=String(process.env.RAW_LICENSE_MASTER_URL||'').trim();
          const u=new URL(raw);
          if(u.protocol!=='https:'||u.hostname!=='incendiarynetworks.cc'||u.search||u.hash)throw new Error('LICENSE_MASTER_URL must point to https://incendiarynetworks.cc');
          let path=u.pathname.replace(/\/+$/,'');
          if(path==='/api')path='/api/v1';
          if(path!=='/api/v1')throw new Error('LICENSE_MASTER_URL path must be /api or /api/v1');
          u.pathname=path;
          process.stdout.write(u.toString().replace(/\/$/,''));
          NODE
          )"
          echo "url=$normalized" >> "$GITHUB_OUTPUT"

      - name: Validate Base release channel
        if: steps.profile.outputs.run == 'true'
        env:
          LICENSE_MASTER_URL: ${{ steps.license-master.outputs.url }}
          LICENSE_MASTER_API_TOKEN: ${{ secrets.LICENSE_MASTER_API_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LICENSE_MASTER_API_TOKEN" || { echo "::error::Missing LICENSE_MASTER_API_TOKEN repository secret."; exit 1; }
          channels="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $LICENSE_MASTER_API_TOKEN" "$LICENSE_MASTER_URL/release-channels?include_disabled=false")"
          CHANNEL="$CHANNEL" CHANNELS="$channels" node -e 'const c=process.env.CHANNEL,j=JSON.parse(process.env.CHANNELS),ok=(j.channels||[]).some(x=>x.channel===c&&x.enabled===true);if(!ok)throw new Error("Base release channel is not configured or is disabled: "+c);'

      - name: Publish Base artifact to GitHub Release
        if: steps.profile.outputs.run == 'true'
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="orbitfs-base-${VERSION}-${SOURCE_SHA:0:8}-run-${GITHUB_RUN_ID}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ARTIFACT" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "OrbitFS Base ${VERSION}" \
              --notes-file release-notes.md
          fi
          ASSET_URL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$ARTIFACT\") | .url" | head -n 1)"
          test -n "$ASSET_URL" || { echo "::error::GitHub Base release asset REST URL was not returned."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Create Base release in License Manager
        if: steps.profile.outputs.run == 'true'
        id: master-release
        env:
          LICENSE_MASTER_URL: ${{ steps.license-master.outputs.url }}
          LICENSE_MASTER_API_TOKEN: ${{ secrets.LICENSE_MASTER_API_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          ARTIFACT_URL: ${{ steps.github-release.outputs.asset_url }}
          ARTIFACT_TAG: ${{ steps.github-release.outputs.tag }}
          DATABASE_PACKAGE_REFERENCE: ${{ steps.database-package.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM="$(sha256sum "$ARTIFACT" | awk '{print $1}')"
          VERSION="$VERSION" CHANNEL="$CHANNEL" SOURCE_SHA="$SOURCE_SHA" CHECKSUM="$CHECKSUM" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" ARTIFACT="$ARTIFACT" ARTIFACT_URL="$ARTIFACT_URL" ARTIFACT_TAG="$ARTIFACT_TAG" node - <<'NODE'
          const fs=require('fs'),{gunzipSync}=require('node:zlib');
          const pkg=JSON.parse(gunzipSync(fs.readFileSync(process.env.ARTIFACT)).toString('utf8'));
          const manifest={
            format:pkg.format,
            schemaVersion:pkg.schemaVersion,
            version:pkg.version,
            sourceCommit:pkg.sourceCommit,
            components:pkg.components,
            componentVersions:pkg.componentVersions,
            checkpointRequired:pkg.checkpointRequired,
            minimumEngineDeployerProtocol:pkg.minimumEngineDeployerProtocol,
            projectSettings:pkg.projectSettings,
            fileCount:pkg.fileCount,
            fileInventory:pkg.fileInventory,
            databaseSchemaVersion:pkg.databaseSchemaVersion,
            databaseSchemaPath:pkg.databaseSchemaPath,
            databaseSchemaSha256:pkg.databaseSchemaSha256,
            databaseMigrationCount:pkg.databaseMigrationCount,
            databaseMigrationRoot:pkg.databaseMigrationRoot,
            databaseMigrationRootSha256:pkg.databaseMigrationRootSha256,
            databaseLatestMigration:pkg.databaseLatestMigration,
            databaseMigrations:pkg.databaseMigrations,
            databaseMigrationChain:pkg.databaseMigrationChain,
            databaseComponentBoundary:pkg.databaseComponentBoundary,
            database:pkg.database,
            databaseCompatibility:pkg.databaseCompatibility,
            databasePackages:{
              format:'orbitfs-database-package-set-v1',
              packages:[JSON.parse(process.env.DATABASE_PACKAGE_REFERENCE)]
            },
            rollbackPolicy:pkg.rollbackPolicy,
            releaseLifecycle:pkg.releaseLifecycle,
            artifactTag:process.env.ARTIFACT_TAG
          };
          const request={
            product:'orbitfs_base',
            version:process.env.VERSION,
            channel:process.env.CHANNEL,
            release_type:'base',
            source_repo:process.env.GITHUB_REPOSITORY,
            source_ref:'base-release',
            source_sha:process.env.SOURCE_SHA,
            artifact_repo:process.env.GITHUB_REPOSITORY,
            artifact_name:process.env.ARTIFACT,
            artifact_run_id:Number(process.env.GITHUB_RUN_ID),
            artifact_url:process.env.ARTIFACT_URL,
            checksum:process.env.CHECKSUM,
            notes:fs.readFileSync('release-notes.md','utf8'),
            vercel_ready:true,
            supabase_ready:true,
            manifest
          };
          fs.writeFileSync('base-release-request.json',JSON.stringify(request));
          NODE
          response="$(curl --fail-with-body --silent --show-error -X POST "$LICENSE_MASTER_URL/releases" -H "Authorization: Bearer $LICENSE_MASTER_API_TOKEN" -H "Content-Type: application/json" --data-binary @base-release-request.json)"
          release_id="$(jq -r '.release.id // .release_id // empty' <<<"$response")"
          test -n "$release_id" || { echo "::error::License Manager did not return a Base release id."; exit 1; }
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Base candidate created in License Manager: $release_id"

      - name: Candidate handoff complete
        if: steps.profile.outputs.run == 'true'
        run: echo "Base candidate is in License Manager. Technical validation runs next; approval/publication remain manual."

  technical-validation:
    name: License Manager technical validation
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Base candidate
        if: steps.profile.outputs.run == 'true'
        env:
          LICENSE_MASTER_URL: ${{ needs.candidate.outputs.license_master_url }}
          LICENSE_MASTER_API_TOKEN: ${{ secrets.LICENSE_MASTER_API_TOKEN }}
          RELEASE_ID: ${{ needs.candidate.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          response="$(curl --fail-with-body --silent --show-error -X POST "$LICENSE_MASTER_URL/releases/$RELEASE_ID/validate" -H "Authorization: Bearer $LICENSE_MASTER_API_TOKEN")"
          status="$(jq -r '.validation.status // .release.manifest.validation.status // empty' <<<"$response")"
          if [ "$status" != "passed" ]; then
            echo "::error::License Manager Base validation failed."
            jq -r '.validation.checks[]? | select(.ok==false) | "[" + (.key//"check") + "] " + (.message//"Validation failed")' <<<"$response" || true
            jq -r '.release.manifest.validation.checks[]? | select(.ok==false) | "[" + (.key//"check") + "] " + (.message//"Validation failed")' <<<"$response" || true
            exit 1
          fi
          echo "License Manager Base validation passed."

      - name: Manual approval handoff
        if: steps.profile.outputs.run == 'true'
        run: echo "Technical validation passed. Approve and publish this Base candidate manually in License Manager before deploying it to customers."