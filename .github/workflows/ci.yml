name: Production Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Version compatibility regression
        run: npm run check:versions
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npx eslint .
      - name: Production build
        run: npm run build
