name: Dispatch Base DB repair repackage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-base-db-repair.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired Base 1.0.0 revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: a986436c877dc2a9dc31c86378154c952381087b
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg source "$SOURCE_SHA" '{
            ref:"base-release",
            inputs:{
              version:"1.0.0",
              source_sha:$source,
              channel:"stable",
              notes:"Database pipeline repair: fixed Engine migration executor regex, preserved Base-owned MCP context RPCs in fresh schemas, and restored the Base-owned RPC contract for existing installs."
            }
          }')"
          curl --fail-with-body --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/publish-base-release.yml/dispatches"             -d "$payload"
          echo "Dispatched Base repair candidate from $SOURCE_SHA"

# retry after License Manager authority fix
