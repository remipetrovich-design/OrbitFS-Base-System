name: Manual Promote Main to Base Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE to validate current main and move base-release to it
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: manual-promote-base-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: fallback
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://dev.incendiarynetworks.cc/api/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. Remaining workflow steps are disabled."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Require explicit promotion confirmation
        if: steps.profile.outputs.run == 'true'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PROMOTE"

      - name: Resolve latest main commit
        if: steps.profile.outputs.run == 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test -n "$sha"
          echo "target_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validating latest main: $sha"

      - name: Checkout latest main exactly
        if: steps.profile.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.target_sha }}
          fetch-depth: 0

      - name: Use Node 24
        if: steps.profile.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.profile.outputs.run == 'true'
        run: npm ci

      - name: Reject Base release history rewrites
        if: steps.profile.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin base-release --prune
          git merge-base --is-ancestor origin/base-release HEAD || {
            echo "::error::base-release diverged from main. Reconcile history without force-pushing."
            exit 1
          }
          changed="$(git diff --name-status origin/base-release HEAD -- supabase/migrations)"
          if printf '%s\n' "$changed" | awk 'NF && $NF ~ /[.]sql$/ && $1 != "A" {bad=1; print "Immutable Base migration changed or deleted: " $0} END {exit !bad}'; then
            echo "::error::Published Base migration files may not be modified or deleted. Add a new migration."
            exit 1
          fi

      - name: Typecheck
        if: steps.profile.outputs.run == 'true'
        run: npm run check

      - name: Production build
        if: steps.profile.outputs.run == 'true'
        run: npm run build

      - name: Verify Base release artifact can be generated
        if: steps.profile.outputs.run == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: |
          set -euo pipefail
          node tools/build-customer-schema.mjs --schema-version 2 --output supabase/customer-schema.sql --metadata /tmp/orbitfs-database-schema.json
          test -s supabase/customer-schema.sql
          test "$(jq -r '.migrationCount' /tmp/orbitfs-database-schema.json)" -gt 0
          test "$(jq -r '.sha256' /tmp/orbitfs-database-schema.json | wc -c)" -eq 65
          node tools/build-panel-release.mjs --version 0.0.0-ci --channel stable --commit "$TARGET_SHA" --database-metadata /tmp/orbitfs-database-schema.json --output /tmp/orbitfs-base-ci.json.gz
          test -s /tmp/orbitfs-base-ci.json.gz
          node -e "const fs=require('fs'),{gunzipSync}=require('zlib');const p=JSON.parse(gunzipSync(fs.readFileSync('/tmp/orbitfs-base-ci.json.gz'))),c=p.databaseMigrationChain;if(p.format!=='orbitfs-base-deployment-v2'||p.schemaVersion!==2||p.releaseChannel!=='stable'||!p.files?.length||p.databaseCompatibility?.mode!=='expand-contract'||p.databaseCompatibility?.migrationMode!=='forward-only'||p.databaseCompatibility?.automaticDestructiveMigrations!==false||p.rollbackPolicy?.databaseRollback!=='forward-only-no-down-migrations'||c?.format!=='orbitfs-base-migration-chain-v1'||c?.complete!==true||c?.baseline!==true||c?.migrationCount!==p.databaseMigrationCount||c?.rootMigration!==p.databaseMigrationRoot||c?.rootSha256!==p.databaseMigrationRootSha256||c?.latestMigration!==p.databaseLatestMigration||!Array.isArray(c?.migrations)||c.migrations.length!==p.databaseMigrationCount||p.database?.migrationChain?.rootMigration!==p.databaseMigrationRoot)process.exit(1)"

      - name: Verify public License Manager API contract
        if: steps.profile.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header 'content-type: application/json' --header 'accept: application/json' --data '{"license_key":"LIC-AAAAAAAAAA-BBBBBBBBBB-CCCCCCCCCC","product":"orbitfs_base","component":"orbitfs_base","installation_id":"ci-contract-orbitfs-base"}' 'https://incendiarynetworks.cc/api/v1/license/validate')"
          cat "$response_file"
          if [ "$status" != "404" ] && [ "$status" != "403" ]; then
            echo "Unexpected License Manager validation status: $status"
            exit 1
          fi
          updater_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' 'https://incendiarynetworks.cc/api/v1/updater?product=orbitfs_base&channel=stable&type=update')"
          cat "$response_file"
          test "$updater_status" = "401"

      - name: Promote validated main to base-release
        if: steps.profile.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: base-release
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$current" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$RELEASE_BRANCH" -f sha="$TARGET_SHA" >/dev/null
          elif [ "$current" != "$TARGET_SHA" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH" -f sha="$TARGET_SHA" -F force=false >/dev/null
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha')"
          test "$actual" = "$TARGET_SHA"
          git fetch origin "$RELEASE_BRANCH" --prune
          test "$(git rev-parse 'HEAD:supabase/migrations')" = "$(git rev-parse "origin/$RELEASE_BRANCH:supabase/migrations")" || {
            echo "::error::Base database migrations differ after promotion."
            exit 1
          }
          echo "$RELEASE_BRANCH now points to validated main $TARGET_SHA with identical database migrations."